# Configuração das edge functions do Postador Automático.
# verify_jwt = true → exige JWT de usuário logado (chamadas do app).
# publish-now é a exceção: é invocada pelo pg_cron com a service role key
# e valida o Bearer manualmente dentro da função.

[functions.scrape-youtube]
verify_jwt = true

[functions.scrape-instagram]
verify_jwt = true

[functions.scrape-tiktok]
verify_jwt = true

[functions.generate-roteiro]
verify_jwt = true

[functions.refresh-oauth]
verify_jwt = true

[functions.publish-now]
verify_jwt = false

[functions.publish-instagram]
verify_jwt = true

[functions.publish-youtube]
verify_jwt = true

[functions.publish-tiktok]
verify_jwt = true

[functions.publish-facebook]
verify_jwt = true

[functions.analyze-viral-patterns]
verify_jwt = true

[functions.generate-legal-content]
verify_jwt = true
